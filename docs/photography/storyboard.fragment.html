<style>
#photo-proposal{color:var(--foreground);display:grid;gap:calc(var(--font-size-base)*1.2)}
#photo-proposal .story-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:calc(var(--font-size-base)*1.8);align-items:center}
#photo-proposal .sketch{aspect-ratio:1.45;min-width:0;position:relative;color:var(--foreground)}
#photo-proposal .sketch>svg{width:100%;height:100%;display:block;overflow:hidden}
#photo-proposal .sketch [data-scene][hidden]{display:none}
#photo-proposal .paper{fill:var(--background);stroke:var(--muted-foreground);stroke-width:1.5}
#photo-proposal .metal{fill:var(--muted);stroke:var(--muted-foreground);stroke-width:1.5}
#photo-proposal .shade{fill:color-mix(in srgb,var(--muted-foreground) 24%,var(--background));stroke:var(--muted-foreground);stroke-width:1.5}
#photo-proposal .ink{fill:var(--foreground)}
#photo-proposal .outline{fill:none;stroke:var(--muted-foreground);stroke-width:1.5}
#photo-proposal .target{fill:none;stroke:var(--orange);stroke-width:3}
#photo-proposal .red{fill:color-mix(in srgb,var(--red) 27%,var(--background));stroke:var(--muted-foreground);stroke-width:1}
#photo-proposal .green{fill:color-mix(in srgb,var(--green) 27%,var(--background));stroke:var(--muted-foreground);stroke-width:1}
#photo-proposal .blue{fill:color-mix(in srgb,var(--blue) 27%,var(--background));stroke:var(--muted-foreground);stroke-width:1}
#photo-proposal .focus-fill{fill:color-mix(in srgb,var(--blue) 15%,var(--background));stroke:var(--muted-foreground);stroke-width:1.5}
#photo-proposal .author-space{display:grid;gap:calc(var(--font-size-base)*.75);padding-top:calc(var(--font-size-base)*1.2)}
#photo-proposal .author-space span{color:var(--muted-foreground)}
#photo-proposal .author-space hr{margin:0;border:0;border-top:1px dashed var(--border);width:100%}
#photo-proposal .author-space hr:last-child{width:66%}
#photo-proposal .beat-copy{display:grid;gap:calc(var(--font-size-base)*.7);min-width:0}
#photo-proposal .beat-copy h3{font-family:Georgia,serif;font-weight:400}
#photo-proposal .legend{display:flex;gap:calc(var(--font-size-base)*.6);flex-wrap:wrap;min-height:calc(var(--font-size-base)*2);align-items:center}
#photo-proposal .legend span{color:var(--muted-foreground)}
#photo-proposal .navigation{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--font-size-base)*.6)}
#photo-proposal .select-wrap{display:grid;gap:calc(var(--font-size-base)*.4)}
#photo-proposal select{max-width:100%;min-width:0}
#photo-proposal .note-row{display:flex;justify-content:space-between;gap:calc(var(--font-size-base)*1);flex-wrap:wrap}
@media(max-width:560px){#photo-proposal .story-layout{grid-template-columns:1fr}#photo-proposal .author-space{padding-top:0}#photo-proposal .sketch{aspect-ratio:1.6}}
</style>

<script>
(()=>{
const root=document.getElementById('photo-proposal');
const select=root.querySelector('select'),prev=root.querySelector('[data-prev]'),next=root.querySelector('[data-next]');
const beats=[
 ['THE RESULT','How did this come from a phone?','Photograph → phone → selected camera.','Proposed scene','Selected phone camera','Opening photograph stays large.'],
 ['INSIDE THE CAMERA','What is behind this lens?','Phone → camera module → lens assembly → exposed sensor.','Approach one camera','Expose its sensor','Stable hold: show your physical camera live.'],
 ['THE PHYSICAL CONSTRAINT','How small is it?','Phone sensor beside your camera sensor and a fingernail reference.','Inspection magnification','Physical-size comparison','Dimensions and relative sizes need device verification.'],
 ['ACROSS SPACE','One site. One filtered measurement.','Sensor patch → Bayer grid → one measured component, two missing.','Microlenses + filters','One populated component','Use the selected source’s actual Bayer pattern.'],
 ['ACROSS SPACE','Borrow the missing colour from next door.','Green neighbours → blue neighbours → reconstructed photograph.','Exact contributors','One measured + two estimated','Keep one selected site still through the explanation.'],
 ['WHY LIGHT MATTERS','What happens when there is little light?','Dim detail → fluctuating measurements → one noisy observation.','Real dim detail','Brief noise schematic','The measurement bars here are conceptual, not camera data.'],
 ['ACROSS TIME','Line up. Then combine.','Actual captures → unaligned average → alignment → robust merge.','Separate observations','Matched comparison','Same exposure; use only the source’s real capture count.'],
 ['ACROSS TIME','Different exposures, different useful evidence.','Real exposure bracket → usable bright and dark evidence → one result.','Short / medium / long','Combined brightness range','Include only when an actual bracket proves the effect.'],
 ['THE CONNECTION','One photograph. More evidence.','Neighbouring positions + neighbouring moments → the opening image.','Across space','Across time','Finish on the photograph, not another processing stage.']
];
let index=0;
const saved=window.openai?.widgetState?.privateContent?.beat;
if(Number.isInteger(saved)&&saved>=0&&saved<beats.length)index=saved;
function render(){const b=beats[index];select.value=String(index);root.querySelectorAll('[data-scene]').forEach((el,i)=>el.toggleAttribute('hidden',i!==index));root.querySelector('[data-act]').textContent=b[0];root.querySelector('[data-heading]').textContent=b[1];root.querySelector('[data-endpoint]').textContent=b[2];root.querySelector('[data-label-a]').textContent=b[3];root.querySelector('[data-label-b]').textContent=b[4];root.querySelector('[data-pause]').textContent=b[5];root.querySelector('[data-count]').textContent=`${index+1} / ${beats.length}`;prev.disabled=index===0;next.disabled=index===beats.length-1;root.querySelector('svg').setAttribute('aria-label',`Schematic storyboard, not measured data. ${b[1]} ${b[2]}`);}
function choose(i){index=Math.max(0,Math.min(beats.length-1,i));render();window.openai?.setWidgetState?.({modelContent:{selectedBeat:index+1,title:beats[index][1]},privateContent:{beat:index}})?.catch(()=>{});}
select.addEventListener('change',()=>choose(Number(select.value)));prev.addEventListener('click',()=>choose(index-1));next.addEventListener('click',()=>choose(index+1));window.addEventListener('openai:set_globals',event=>{const i=event.detail?.globals?.widgetState?.privateContent?.beat;if(Number.isInteger(i)&&i>=0&&i<beats.length){index=i;render();}});render();
})();
</script>
